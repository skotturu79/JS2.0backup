---
applications:
- name: warehouse-agent
  memory: 512M
  instances: 1
  path: .
  buildpacks:
    - python_buildpack
  command: gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:${PORT} --chdir app main:application
  routes:
    - route: warehouse-agent.cfapps.us10-001.hana.ondemand.com
  env:
    AICORE_DESTINATION_NAME: aicore
    S4HANA_DESTINATION_NAME: FGF_S4HANA
    DESTINATION_NAME: FGF_S4HANA
    AGENT_NAME: D4H-200
    AGENT_LLM_MODEL: gpt-4.1
    LOG_LEVEL: INFO
  services:
    - whse-destination
    - whse-connectivity
