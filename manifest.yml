---
applications:
- name: warehouse-agent
  memory: 512M
  instances: 1
  path: assets/warehouse-agent
  buildpacks:
    - python_buildpack
  command: gunicorn --worker-class uvicorn.workers.UvicornWorker --workers 1 --bind 0.0.0.0:${PORT} --chdir app main:application
  env:
    AICORE_DESTINATION_NAME: aicore
    S4HANA_DESTINATION_NAME: SBPA_d4hclnt200
    DESTINATION_NAME: SBPA_d4hclnt200
    LOG_LEVEL: INFO
  services:
    - whse-destination
    - whse-connectivity
